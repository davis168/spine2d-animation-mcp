[project]
name = "spine2d-mcp"
version = "0.1.0"
description = "MCP server that builds, edits, checks and converts Spine 4.2 and 4.3 skeletons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",  # mcp 2 renamed FastMCP to MCPServer (mcp.server.fastmcp is gone)
    "psd-tools>=1.9.32",
    "Pillow>=10.0.0",
    "rectpack>=0.2.2",
    "pydantic>=2.6.0",
]

[project.scripts]
spine2d-mcp = "spine2d_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# src/ is the spine2d_mcp package: it is built and installed under that name
# (hatchling cannot install a renamed folder in editable mode; setuptools can).
# A new subpackage goes in `packages` too.
[tool.setuptools]
package-dir = { "spine2d_mcp" = "src" }
packages = ["spine2d_mcp", "spine2d_mcp.atlas", "spine2d_mcp.ops", "spine2d_mcp.psd", "spine2d_mcp.runtime",
            "spine2d_mcp.spine"]

[tool.setuptools.package-data]
"spine2d_mcp.runtime" = ["*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
